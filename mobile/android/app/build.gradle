apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.kapt"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def configuredBuildRoot = providers.gradleProperty("TRICKEE_ANDROID_BUILD_ROOT").orNull
def checkoutIsSynced = rootDir.absolutePath.toLowerCase(Locale.ROOT).contains("${File.separator}onedrive${File.separator}")
if (configuredBuildRoot || checkoutIsSynced) {
    def externalBuildRoot = file(configuredBuildRoot ?: "${System.getenv('LOCALAPPDATA')}\\Trickee\\android-build")
    layout.buildDirectory.set(new File(externalBuildRoot, "app"))
}

kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'
def releaseSigningPropertyNames = [
    "TRICKEE_RELEASE_STORE_FILE",
    "TRICKEE_RELEASE_STORE_PASSWORD",
    "TRICKEE_RELEASE_KEY_ALIAS",
    "TRICKEE_RELEASE_KEY_PASSWORD",
]
def externalSigningPropertiesPath = providers.gradleProperty("TRICKEE_RELEASE_PROPERTIES_FILE").orNull
def externalSigningPropertiesFile = externalSigningPropertiesPath ? file(externalSigningPropertiesPath) : null
def externalSigningProperties = new Properties()
if (externalSigningPropertiesFile?.exists()) {
    externalSigningPropertiesFile.withInputStream { externalSigningProperties.load(it) }
}
def releaseSigningValues = [
    storeFile: project.findProperty("TRICKEE_RELEASE_STORE_FILE")?.toString()
        ?: externalSigningProperties.getProperty("storeFile"),
    storePassword: project.findProperty("TRICKEE_RELEASE_STORE_PASSWORD")?.toString()
        ?: externalSigningProperties.getProperty("storePassword"),
    keyAlias: project.findProperty("TRICKEE_RELEASE_KEY_ALIAS")?.toString()
        ?: externalSigningProperties.getProperty("keyAlias"),
    keyPassword: project.findProperty("TRICKEE_RELEASE_KEY_PASSWORD")?.toString()
        ?: externalSigningProperties.getProperty("keyPassword"),
]
def hasReleaseSigning = releaseSigningValues.values().every {
    it != null && !it.toString().trim().isEmpty()
}
def releaseStoreFile = releaseSigningValues.storeFile ? new File(releaseSigningValues.storeFile) : null
if (releaseStoreFile && !releaseStoreFile.isAbsolute() && externalSigningPropertiesFile) {
    releaseStoreFile = new File(externalSigningPropertiesFile.parentFile, releaseSigningValues.storeFile)
}
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains("release")
}
if (releaseTaskRequested && !hasReleaseSigning) {
    throw new GradleException(
        "GPS Driver release builds require the registered upload key through all TRICKEE_RELEASE_* properties or TRICKEE_RELEASE_PROPERTIES_FILE."
    )
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.trickee.gpsdriver"
    sourceSets {
        androidTest.assets.srcDir("$projectDir/schemas")
    }
    defaultConfig {
        applicationId "com.trickee.gpsdriverapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionCode 11
        versionName "1.0.10"
        manifestPlaceholders = [usesCleartextTraffic: "false"]
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${project.findProperty('TRICKEE_GOOGLE_WEB_CLIENT_ID') ?: ''}\""
        buildConfigField "String", "API_ORIGIN", "\"${project.findProperty('TRICKEE_API_ORIGIN') ?: ''}\""
        buildConfigField "String", "WEBSOCKET_ORIGIN", "\"${project.findProperty('TRICKEE_WEBSOCKET_ORIGIN') ?: project.findProperty('TRICKEE_API_ORIGIN') ?: ''}\""
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile releaseStoreFile
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
        pilot {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ["release"]
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.google.code.gson:gson:2.11.0")
    implementation("androidx.room:room-runtime:2.8.4")
    implementation("androidx.room:room-ktx:2.8.4")
    implementation("androidx.work:work-runtime-ktx:2.9.1")
    implementation("com.google.android.gms:play-services-location:21.3.0")
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("androidx.credentials:credentials:1.3.0")
    implementation("androidx.credentials:credentials-play-services-auth:1.3.0")
    implementation("com.google.android.libraries.identity.googleid:googleid:1.1.1")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
    kapt("androidx.room:room-compiler:2.8.4")
    testImplementation("junit:junit:4.13.2")
    testImplementation("com.squareup.okhttp3:mockwebserver:4.12.0")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("androidx.test:runner:1.6.2")
    androidTestImplementation("androidx.room:room-testing:2.8.4")
    androidTestImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // React Native Vector Icons
    // implementation project(':react-native-vector-icons')
}

apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
tasks.configureEach { task ->
    def lowerTaskName = task.name.toLowerCase(Locale.ROOT)
    def consumesPackagedVectorFonts = lowerTaskName.contains("lint") && lowerTaskName.contains("release")
    if (consumesPackagedVectorFonts) {
        task.dependsOn("copyReactNativeVectorIconFonts")
    }
}
